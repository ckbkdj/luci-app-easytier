name: Patch r5 LuCI netmask default

on:
  push:
    branches:
      - fix/24.10.6-ipv6-udp-source
    paths:
      - .github/workflows/patch-r5-luci-netmask.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/24.10.6-ipv6-udp-source
          fetch-depth: 0

      - name: Replace legacy LuCI /8 default
        shell: python
        run: |
          from pathlib import Path
          path = Path('luci-app-easytier/luasrc/model/cbi/easytier.lua')
          text = path.read_text()
          old = 'interface_netmask.default = "255.0.0.0"'
          new = 'interface_netmask.default = "255.255.255.0"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy netmask default, found {count}')
          path.write_text(text.replace(old, new))

      - name: Commit LuCI default fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add luci-app-easytier/luasrc/model/cbi/easytier.lua
          git diff --cached --check
          git commit -m 'fix(luci): default EasyTier interface to /24'
          git push origin HEAD:fix/24.10.6-ipv6-udp-source
