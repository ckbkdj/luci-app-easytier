name: Start fixed OpenWrt 24.10.6 build

on:
  push:
    branches:
      - fix/24.10.6-ipv6-udp-source
    paths:
      - .github/workflows/start-24.10.6-fixed-build.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      CORE_REPO: ckbkdj/EasyTier
      CORE_TAG: v2.6.4-openwrt-ipv6fix.2
      TARGET_BRANCH: fix/24.10.6-ipv6-udp-source
      RELEASE_TAG: v2.6.4-openwrt-ipv6fix.2-openwrt-24.10.6-r3
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify patched multiarch EasyTier release
        shell: bash
        run: |
          set -euo pipefail
          required=(aarch64 x86_64 arm armv7)
          json="$(gh api "repos/${CORE_REPO}/releases/tags/${CORE_TAG}")"
          for arch in "${required[@]}"; do
            name="easytier-linux-${arch}-${CORE_TAG}.zip"
            jq -e --arg n "$name" '.assets[] | select(.name == $n)' >/dev/null <<<"$json" || {
              echo "missing patched core asset: $name" >&2
              exit 1
            }
          done
          echo "patched EasyTier ${CORE_TAG} release is ready"

      - name: Dispatch OpenWrt 24.10.6 + SNAPSHOT matrix
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" \
            -f ref="$TARGET_BRANCH" \
            -f "inputs[tag]=$RELEASE_TAG" \
            -f "inputs[text]=Corrected package metadata: EasyTier/luci-app-easytier 2.6.4-r3; patched EasyTier v2.6.4 IPv6 UDP/WireGuard source-address fix; OpenWrt 24.10.6 and SNAPSHOT multi-architecture build."
          echo "dispatched corrected 2.6.4-r3 build.yml on ${TARGET_BRANCH}"
