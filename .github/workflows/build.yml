name: Build-OpenWrt-EasyTier

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '请填写发布Releases的版本号（留空不发布）'
        required: false
        default: ''
      text:
        description: '请填写发布的说明'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: "${{ github.event.inputs.tag }}"
  TZ: Asia/Shanghai
  EXPECTED_EASYTIER_VERSION: "2.6.4"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_arm1176jzf-s_vfp
          - arm_arm926ej-s
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - x86_64
        sdk:
          - 24.10.6
          - SNAPSHOT

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate source version metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -qx "EASYTIER_VERSION=${EXPECTED_EASYTIER_VERSION}" version.mk
          grep -q 'EASYTIER_RELEASE_REPO=ckbkdj/EasyTier' version.mk
          grep -q 'EASYTIER_RELEASE_TAG=v2.6.4-openwrt-ipv6fix.2' version.mk
          grep -q 'PKG_VERSION:=$(or $(EASYTIER_VERSION),2.6.4)' easytier/Makefile
          grep -q 'PKG_VERSION:=$(or $(EASYTIER_VERSION),2.6.4)' luci-app-easytier/Makefile
          if grep -R --line-number --fixed-strings 'PKG_VERSION:=$(or $(EASYTIER_VERSION),2.6.0)' easytier luci-app-easytier; then
            echo 'stale 2.6.0 package metadata detected' >&2
            exit 1
          fi

      - name: Cache OpenWrt SDK
        uses: actions/cache@v5
        with:
          path: |
            /opt/openwrt-sdk-${{ matrix.arch }}-${{ matrix.sdk }}
            dl
          key: sdk-${{ matrix.arch }}-${{ matrix.sdk }}

      - name: Create i18n uci-defaults file
        run: |
          mkdir -p luci-app-easytier/root/etc/uci-defaults
          cat > luci-app-easytier/root/etc/uci-defaults/luci-i18n-easytier-zh-cn << 'EOF'
          #!/bin/sh
          uci -q batch << EOI
          set luci.languages.zh_cn='简体中文 (Simplified Chinese)'
          commit luci
          EOI
          rm -f /tmp/luci-indexcache /tmp/luci-modulecache/*
          exit 0
          EOF
          chmod +x luci-app-easytier/root/etc/uci-defaults/luci-i18n-easytier-zh-cn

      - name: Building packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: easytier luci-app-easytier
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          MAKEFLAGS: -j$(nproc)
          V: s

      - name: Validate built package versions
        shell: bash
        run: |
          set -euo pipefail
          PKG_DIR="bin/packages/${{ matrix.arch }}/packages_ci"
          echo "Built package files:"
          find "$PKG_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

          core_files="$(find "$PKG_DIR" -maxdepth 1 -type f \( -name 'easytier_*.ipk' -o -name 'easytier-*.apk' \) -printf '%f\n')"
          luci_files="$(find "$PKG_DIR" -maxdepth 1 -type f \( -name 'luci-app-easytier_*.ipk' -o -name 'luci-app-easytier-*.apk' \) -printf '%f\n')"

          test -n "$core_files"
          test -n "$luci_files"
          echo "$core_files" | grep -F "$EXPECTED_EASYTIER_VERSION"
          echo "$luci_files" | grep -F "$EXPECTED_EASYTIER_VERSION"

          if find "$PKG_DIR" -maxdepth 1 -type f -name '*easytier*2.6.0*' | grep -q .; then
            echo 'built artifact still contains stale 2.6.0 version' >&2
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}-${{ matrix.sdk }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/*

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.inputs.tag != '' }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release info
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          mkdir -p release
          shopt -s nullglob
          for dir in artifacts/*; do
            name=$(basename "$dir")
            files=("$dir"/*.ipk "$dir"/*.apk)
            if [ ${#files[@]} -gt 0 ]; then
              zip -j "release/EasyTier-${{ env.TAG }}-${name}.zip" "${files[@]}"
            fi
          done
          echo "build_time=$(TZ=UTC-8 date '+%Y年%m月%d日%H:%M:%S' | jq -sRr @uri)" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            > ### ![](https://img.shields.io/badge/%E7%BC%96%E8%AF%91%E6%97%B6%E9%97%B4-${{ env.build_time }}-easytier?logo=github&labelColor=%E9%A1%BB)![](https://img.shields.io/github/downloads/${{ github.repository }}/${{ env.TAG }}/total?label=%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&logo=github)

            - Package version: `2.6.4-r3`，不会再生成 `2.6.0` 降级包。
            - `24.10.6` 为 OpenWrt 24.10.6 构建产物。
            - `SNAPSHOT` 为 OpenWrt SNAPSHOT / APK 构建产物。
            - EasyTier core 来源：`ckbkdj/EasyTier` 的 `v2.6.4-openwrt-ipv6fix.2` IPv6 UDP/WireGuard 修复版。

            ${{ github.event.inputs.text }}
          tag_name: ${{ env.TAG }}
          files: release/*.zip
